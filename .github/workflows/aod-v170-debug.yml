name: AOD v1.7.0 Debug CI

on:
  push:
    branches:
      - tmp/aod-v1.7.0-debug-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Reconstruct audited v1.6.2 baseline patch
        run: |
          cat aod-ci/patch.part* | tr -d '\r\n' | base64 -d > /tmp/aod-patch.zip
          echo "13ac2880378b7afdfc655639b2e94e282638c01c87ad65173129c285a0e138b6  /tmp/aod-patch.zip" | sha256sum -c -
          unzip -q /tmp/aod-patch.zip -d /tmp/aod-patch

      - name: Fetch exact upstream baseline
        run: |
          git clone https://github.com/Qjj7679/ColorOS_Aod_Enhance.git /tmp/aod-src
          cd /tmp/aod-src
          git checkout ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4
          test "$(git rev-parse HEAD)" = "ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4"

      - name: Apply v1.7.0 cleanup and hardening
        run: |
          cp -a /tmp/aod-patch/patch/app/. /tmp/aod-src/app/
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/DebugFileLogger.kt
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          rm -f /tmp/aod-src/app/src/debug/AndroidManifest.xml
          cat aod-v170/parts/part* | tr -d '\r\n' | base64 -d > /tmp/aod-v170-overlay.zip
          echo "5eb5d5d134f557c63054cb000621d431b3dccf006956f4e584d5ad7089f4eb21  /tmp/aod-v170-overlay.zip" | sha256sum -c -
          unzip -q /tmp/aod-v170-overlay.zip -d /tmp/v170
          cp -a /tmp/v170/app/. /tmp/aod-src/app/

          grep -q "versionCode = 21" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.7.0-debug'" /tmp/aod-src/app/build.gradle
          grep -q "include 'arm64-v8a'" /tmp/aod-src/app/build.gradle
          ! grep -q "armeabi-v7a" /tmp/aod-src/app/build.gradle
          test ! -e /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/DebugFileLogger.kt
          test ! -e /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          test ! -e /tmp/aod-src/app/src/debug/AndroidManifest.xml
          ! grep -R "MANAGE_EXTERNAL_STORAGE\|DEBUG_FILE_LOG\|DebugFileLogger\|DebugFileLogStore" /tmp/aod-src/app/src/main /tmp/aod-src/app/src/debug 2>/dev/null
          grep -q "Debug 构建仅写 Android logcat" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodLog.kt
          grep -q "createPackageContext(expected" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodConfig.kt
          grep -q "bindHostPackage(SYSTEM_UI)" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/MainHook.kt
          grep -q "sys/class/power_supply/battery/current_now" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          grep -q "powerValid=" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          grep -q "supportedModes=" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt

      - name: Test, lint and build
        working-directory: /tmp/aod-src
        run: |
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF
          ./gradlew --no-daemon --max-workers=1 --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Audit APK
        working-directory: /tmp/aod-src
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -f "$APK"
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          ! find app/build/outputs/apk -name '*armeabi*' | grep .
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          "$BT/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q "package: name='com.op.aod.enhance'" /tmp/badging.txt
          grep -q "versionCode='21'" /tmp/badging.txt
          grep -q "versionName='1.7.0-debug'" /tmp/badging.txt
          ! grep -q "MANAGE_EXTERNAL_STORAGE" /tmp/permissions.txt
          unzip -p "$APK" assets/xposed_init | grep -q "com.op.aod.enhance.HookEntryXposed"
          sha256sum "$APK" | tee /tmp/apk.sha256

          mkdir -p /tmp/out
          cp "$APK" /tmp/out/ColorOS_AOD_Enhance-v1.7.0-debug-arm64-v8a.apk
          cp /tmp/apk.sha256 /tmp/out/SHA256SUMS.txt
          {
            echo "baseline=ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4"
            echo "versionName=1.7.0-debug"
            echo "versionCode=21"
            echo "abi=arm64-v8a only"
            echo "logging=Android logcat only (tag AOD_Enhance)"
            echo "removed=DebugFileLogger, DebugFileLogStore, MANAGE_EXTERNAL_STORAGE, file-log UI/provider IPC"
            echo "config=package-scoped Provider access using real host package identity"
            echo "telemetry=framework refresh + supported modes + sysfs-preferred battery current/voltage"
            echo "power=whole-device battery estimate only when current unit is trusted"
          } > /tmp/out/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-AOD-Enhance-v1.7.0-debug-arm64
          path: /tmp/out/
          if-no-files-found: error
