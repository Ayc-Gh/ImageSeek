name: AOD v1.6.1 Debug File Log APK Build

on:
  push:
    branches:
      - tmp/aod-v1.6.1-debuglog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Rebuild and verify v1.6.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat             .aod-patch/chunk00 .aod-patch/chunk01 .aod-patch/chunk02 .aod-patch/chunk03 .aod-patch/chunk04 .aod-patch/chunk05             .aod-patch/chunk06-*             .aod-patch/chunk07-00 .aod-patch/chunk07-01 .aod-patch/chunk07-02 .aod-patch/chunk07-03             .aod-patch/chunk07-04-*             .aod-patch/chunk07-05 .aod-patch/chunk07-06 .aod-patch/chunk07-07 .aod-patch/chunk07-08             .aod-patch/chunk07-09-* .aod-patch/chunk07-10-* .aod-patch/chunk07-11-* .aod-patch/chunk07-12-*             .aod-patch/chunk07-13 > /tmp/aodpatch.b64
          test "$(wc -c < /tmp/aodpatch.b64)" -eq 47576
          base64 --decode /tmp/aodpatch.b64 > /tmp/ColorOS_Aod_Enhance-v1.6.1-patch.zip
          echo "b34a68c17958c702368fd39c18d03e21b91b42cc9544a11db42677c2af0f4317  /tmp/ColorOS_Aod_Enhance-v1.6.1-patch.zip" | sha256sum -c -

      - name: Rebuild and verify debug-log overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .aod-debug-overlay/chunk00 .aod-debug-overlay/chunk01 .aod-debug-overlay/chunk02 .aod-debug-overlay/chunk03 .aod-debug-overlay/chunk04 .aod-debug-overlay/chunk05 > /tmp/aod-debug-overlay.b64
          test "$(wc -c < /tmp/aod-debug-overlay.b64)" -eq 31572
          base64 --decode /tmp/aod-debug-overlay.b64 > /tmp/aod-debug-overlay.zip
          echo "96192ffa62d472b9aefa44147e91956acf8f6cd2b308c12fe614cd3ffe2def70  /tmp/aod-debug-overlay.zip" | sha256sum -c -

      - name: Fetch audited source and apply v1.6.1
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Qjj7679/ColorOS_Aod_Enhance.git /tmp/aod-src
          git -C /tmp/aod-src checkout ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4
          rm -rf /tmp/aod-overlay
          mkdir -p /tmp/aod-overlay
          unzip -q /tmp/ColorOS_Aod_Enhance-v1.6.1-patch.zip -d /tmp/aod-overlay
          bash /tmp/aod-overlay/ColorOS_Aod_Enhance-v1.6.1-patch/apply_v1.6.1.sh /tmp/aod-src
          grep -q "versionCode = 17" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.6.1'" /tmp/aod-src/app/build.gradle
          grep -q "compileSdk = 37" /tmp/aod-src/app/build.gradle

      - name: Apply Debug file-log overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aod-debug-overlay
          mkdir -p /tmp/aod-debug-overlay
          unzip -q /tmp/aod-debug-overlay.zip -d /tmp/aod-debug-overlay
          cp -a /tmp/aod-debug-overlay/. /tmp/aod-src/
          grep -q "versionCode = 18" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.6.1-debuglog'" /tmp/aod-src/app/build.gradle
          grep -q "METHOD_APPEND_DEBUG_LOG" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/AodConfigProvider.kt
          grep -q "Documents/AOD_Enhance/log" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          grep -q "MAX_FILE_BYTES = 8L \* 1024L \* 1024L" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          grep -q "MAX_FILES = 8" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' 'org.gradle.workers.max=2' > /tmp/aod-src/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: /tmp/aod-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Run lint
        working-directory: /tmp/aod-src
        shell: bash
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APKs
        working-directory: /tmp/aod-src
        shell: bash
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          AAPT=/usr/local/lib/android/sdk/build-tools/37.0.0/aapt
          APKSIGNER=/usr/local/lib/android/sdk/build-tools/37.0.0/apksigner
          : > out/BUILD_INFO.txt
          while IFS= read -r apk; do
            name="$(basename "$apk")"
            cp "$apk" "out/$name"
            echo "===== $name =====" | tee -a out/BUILD_INFO.txt
            "$AAPT" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee -a out/BUILD_INFO.txt
            "$AAPT" dump badging "$apk" | grep -q "package: name='com.op.aod.enhance' versionCode='18' versionName='1.6.1-debuglog'"
            unzip -p "$apk" assets/xposed_init | grep -q "com.op.aod.enhance.HookEntryXposed"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee -a out/BUILD_INFO.txt
          done < <(find /tmp/aod-src/app/build/outputs/apk/debug -type f -name '*.apk' -print | sort)
          test -n "$(find out -maxdepth 1 -name '*.apk' -print -quit)"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS-AOD-Enhance-v1.6.1-debuglog
          path: out/*
          if-no-files-found: error
          retention-days: 3
