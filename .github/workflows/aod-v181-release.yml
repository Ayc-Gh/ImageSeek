name: AOD v1.8.1 Release CI

on:
  push:
    branches:
      - tmp/aod-v1.8.1-release-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Reconstruct audited base patch
        run: |
          cat aod-ci/patch.part* | tr -d '\r\n' | base64 -d > /tmp/aod-patch.zip
          echo "13ac2880378b7afdfc655639b2e94e282638c01c87ad65173129c285a0e138b6  /tmp/aod-patch.zip" | sha256sum -c -
          unzip -q /tmp/aod-patch.zip -d /tmp/aod-patch

      - name: Reconstruct v1.7.0 overlay
        run: |
          cat aod-v170-exact/p00_* aod-v170-bridge/overlay.part01 aod-v170-bridge/overlay.part02 aod-v170-bridge/overlay.part03 aod-v170-exact/p04_* | tr -d '\r\n' | base64 -d > /tmp/v170.zip
          echo "a12023d08583aa936aa1ae35402d860e23e179a2dcd6f05b92b13fa553181e94  /tmp/v170.zip" | sha256sum -c -
          unzip -q /tmp/v170.zip -d /tmp/v170

      - name: Fetch exact upstream baseline
        run: |
          git clone https://github.com/Qjj7679/ColorOS_Aod_Enhance.git /tmp/aod-src
          cd /tmp/aod-src
          git checkout ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4
          test "$(git rev-parse HEAD)" = "ef9df74fc8f6d5ae3bc39f35a110047ea8b905c4"

      - name: Overlay v1.7.0 source
        run: |
          cp -a /tmp/aod-patch/patch/app/. /tmp/aod-src/app/
          cp -a /tmp/v170/app/. /tmp/aod-src/app/
          rm -f /tmp/aod-src/app/src/debug/AndroidManifest.xml
          rmdir /tmp/aod-src/app/src/debug 2>/dev/null || true
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/DebugFileLogger.kt
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/DebugFileLogStore.kt
          rm -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/AodConfigProvider.kt

          # Migrate all inherited v1.6.x debug calls to the logcat-only logger.
          grep -R -l "DebugFileLogger" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook --include='*.kt' | xargs -r sed -i 's/DebugFileLogger/AodLog/g'

          # Preserve the useful brightness snapshot API used by BrightnessHook, but keep it purely in memory.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt')
          s=p.read_text()
          marker='''    @Volatile private var powerSamples = 0L\n'''
          addition=marker+'''    @Volatile private var latestBrightness: Int? = null\n    @Volatile private var latestBrightnessPath = "NA"\n\n    fun onBrightnessEvent(path: String, brightness: Int) {\n        latestBrightnessPath = path\n        latestBrightness = brightness\n    }\n'''
          if 'fun onBrightnessEvent(path: String, brightness: Int)' not in s:
              s=s.replace(marker, addition)
          needle='''                "batteryPct=${fmt(levelPct)} tempC=${fmt(tempC)} status=${batteryStatusName(status)} plugged=$plugged " +\n'''
          repl='''                "brightness=${latestBrightness ?: "NA"} brightnessPath=$latestBrightnessPath " +\n                "batteryPct=${fmt(levelPct)} tempC=${fmt(tempC)} status=${batteryStatusName(status)} plugged=$plugged " +\n'''
          if 'brightnessPath=$latestBrightnessPath' not in s:
              s=s.replace(needle, repl)
          p.write_text(s)
          PY

          grep -q "versionCode = 21" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.7.0-debug'" /tmp/aod-src/app/build.gradle
          grep -q "include 'arm64-v8a'" /tmp/aod-src/app/build.gradle
          ! grep -q "armeabi-v7a" /tmp/aod-src/app/build.gradle
          grep -q "YukiHookPrefsBridge" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodConfig.kt
          grep -q "prefs(PREFS_NAME)" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/AodConfigStore.kt
          grep -q "xposedminversion" /tmp/aod-src/app/src/main/AndroidManifest.xml
          grep -q 'android:value="93"' /tmp/aod-src/app/src/main/AndroidManifest.xml
          ! grep -R -n -E "AodConfigProvider|DebugFileLogger|DebugFileLogStore|MANAGE_EXTERNAL_STORAGE|DEBUG_FILE_LOG|/storage/emulated/0/Documents/AOD_Enhance" /tmp/aod-src/app/src /tmp/aod-src/app/build.gradle
          ! grep -q "<provider" /tmp/aod-src/app/src/main/AndroidManifest.xml

      - name: Apply v1.8.0 duration and power fixes
        run: |
          cp aod-v180/src/AodUiConfig.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/
          cp aod-v180/src/AodConfigContract.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/
          cp aod-v180/src/AodConfigStore.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/
          cp aod-v180/src/AodConfig.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/
          cp aod-v180/src/MainHook.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/
          cp aod-v180/src/AodDurationHook.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/
          cp aod-v180/src/FeaturesActivity.kt /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/ui/
          sed -i "s/versionCode = 21/versionCode = 22/" /tmp/aod-src/app/build.gradle
          sed -i "s/versionName = '1.7.0-debug'/versionName = '1.8.0-debug'/" /tmp/aod-src/app/build.gradle
          sed -i '/val sysCurrentUa = sysCurrentRaw?.value/a\        val sysCurrentExplicitUa = sysCurrentRaw?.path?.contains("_ua_") == true' /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          perl -0pi -e 's/sysCurrentUa != null -> CurrentChoice\(sysCurrentUa, "sysfs:\$\{sysCurrentRaw\.path\}", true\)/sysCurrentUa != null && (sysCurrentExplicitUa || abs(sysCurrentUa) >= API_CURRENT_MIN_PLAUSIBLE_UA) ->\n                CurrentChoice(sysCurrentUa, "sysfs:\$\{sysCurrentRaw.path\}(uA-trusted)", true)\n            sysCurrentUa != null ->\n                CurrentChoice(sysCurrentUa, "sysfs:\$\{sysCurrentRaw.path\}(unit-ambiguous)", false)/g' /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          perl -0pi -e 's#"/sys/class/power_supply/battery/current_now",\n        "/sys/class/power_supply/battery/batt_current_ua_now",#"/sys/class/power_supply/battery/batt_current_ua_now",\n        "/sys/class/power_supply/battery/current_now",#g' /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          grep -q "versionCode = 22" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.8.0-debug'" /tmp/aod-src/app/build.gradle
          grep -q "DURATION_MODE_30_SECONDS" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/data/AodConfigContract.kt
          grep -q "AOD_DURATION_EXPIRED" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodDurationHook.kt
          grep -q "Duration.Limit" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/MainHook.kt
          grep -q "unit-ambiguous" /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt

      - name: Apply v1.8.1 release hardening
        run: |
          python3 aod-v181/apply_release.py
          test ! -f /tmp/aod-src/app/src/main/kotlin/com/op/aod/enhance/hook/AodTelemetry.kt
          ! grep -R -n "AodTelemetry" /tmp/aod-src/app/src/main/kotlin
          ! grep -R -n -E "TELEMETRY_HOOK|AOD_SESSION_START|AOD_SESSION_END|AOD_TELEMETRY" /tmp/aod-src/app/src/main/kotlin
          grep -q "versionCode = 23" /tmp/aod-src/app/build.gradle
          grep -q "versionName = '1.8.1'" /tmp/aod-src/app/build.gradle
          ! grep -q "versionName = '1.8.0-debug'" /tmp/aod-src/app/build.gradle

      - name: Create release signing key
        run: |
          mkdir -p /tmp/aod-signing
          keytool -genkeypair -v -keystore /tmp/aod-signing/release.jks \
            -storepass AodEnhanceV181Release -keypass AodEnhanceV181Release \
            -alias aod_release -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=ColorOS AOD Enhance, OU=Local Release, O=AOD Enhance, L=Local, ST=Local, C=US"
          cat > /tmp/aod-src/keystore.properties <<'EOF'
          storeFile=/tmp/aod-signing/release.jks
          storePassword=AodEnhanceV181Release
          keyAlias=aod_release
          keyPassword=AodEnhanceV181Release
          EOF

      - name: Test, lint and build release
        working-directory: /tmp/aod-src
        run: |
          chmod +x gradlew
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF
          ./gradlew --no-daemon --max-workers=1 --stacktrace clean testDebugUnitTest lintRelease assembleRelease

      - name: Audit release APK
        working-directory: /tmp/aod-src
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          test "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          ! find app/build/outputs/apk -name '*armeabi*' | grep .
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.op.aod.enhance'" /tmp/badging.txt
          grep -q "versionCode='23'" /tmp/badging.txt
          grep -q "versionName='1.8.1'" /tmp/badging.txt
          unzip -p "$APK" assets/xposed_init | grep -q "com.op.aod.enhance.HookEntryXposed"
          ! unzip -l "$APK" | grep -q "lib/armeabi-v7a"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          ! grep -q "AodTelemetry" /tmp/dex-strings.txt
          ! grep -q "AOD_TELEMETRY" /tmp/dex-strings.txt
          ! grep -q "TELEMETRY_HOOK" /tmp/dex-strings.txt
          ! grep -q "1.8.0-debug" /tmp/dex-strings.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          mkdir -p /tmp/out
          cp "$APK" /tmp/out/ColorOS_AOD_Enhance-v1.8.1-arm64-v8a.apk
          cp /tmp/apk.sha256 /tmp/out/SHA256SUMS.txt
          cp /tmp/signature.txt /tmp/out/SIGNATURE_INFO.txt
          {
            echo "versionName=1.8.1"
            echo "versionCode=23"
            echo "buildType=release"
            echo "minify=true"
            echo "shrinkResources=true"
            echo "abi=arm64-v8a only"
            echo "debugTelemetry=removed"
            echo "releaseLogging=warnings/errors only"
            echo "config_transport=YukiHookPrefsBridge (New XSharedPreferences)"
            echo "duration_control=system,30s,1m,5m,10m,30m,60m,always,custom(1-1440m)"
            echo "display_policy=system-managed; no ADFR/min_fps writes"
            echo "signing=locally generated release certificate for this build"
          } > /tmp/out/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-AOD-Enhance-v1.8.1-release-arm64
          path: /tmp/out/
          if-no-files-found: error
