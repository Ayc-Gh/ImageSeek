name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build, test, and lint
        shell: bash
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Audit APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK: $APK"
          sha256sum "$APK"
          echo "--- Native libraries ---"
          if unzip -l "$APK" | grep -E 'lib/[^/]+/.*\.so$'; then
            echo "Unexpected native libraries found" >&2
            exit 1
          fi
          echo "No native .so files"
          echo "--- Manifest permissions ---"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          PERMS=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep "uses-permission:" || true)
          echo "$PERMS"
          echo "$PERMS" | grep -q "android.permission.INTERNET"
          if echo "$PERMS" | grep -Ev 'android\.permission\.INTERNET|^$'; then
            echo "Unexpected permission found" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageSeek-2.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImageSeek-2.1.0-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30
