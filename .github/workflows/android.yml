name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release and lint
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintRelease assembleRelease

      - name: Audit unsigned release APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.akslabs.multiimagesearch'"
          echo "$BADGING" | grep -q "versionCode='212'"
          echo "$BADGING" | grep -q "versionName='2.1.2'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 "$APK"
          sha256sum "$APK"

      - name: Stage Android signing tools
        run: |
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/lib64/

      - uses: actions/upload-artifact@v4
        with:
          name: ImageSeek-2.1.2-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Android-build-tools-35-signing
          path: signing-tools
          if-no-files-found: error


  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish v2.1.2 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.1.2 >/dev/null 2>&1; then
            echo "v2.1.2 already exists"
            exit 0
          fi
          gh release create v2.1.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ImageSeek 2.1.2" \
            --notes-file RELEASE_NOTES_2.1.2.md
